name: Frame world-stability experiment
on:
  push:
    branches: [dev]
    paths:
      - 'probe/world_stability*'
      - 'tests/world_stability_test.cpp'
      - 'tests/test_world_stability_report.py'
      - 'tools/*world_stability*'
      - 'docs/development/WORLD-STABILITY.md'
      - 'distribution/experiments/world-stability-v*'
      - '.github/workflows/world-stability-tests.yml'
  pull_request:
    paths:
      - 'probe/world_stability*'
      - 'tests/world_stability_test.cpp'
      - 'tests/test_world_stability_report.py'
      - 'tools/*world_stability*'
      - '.github/workflows/world-stability-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host and AArch64 compilers
        run: sudo apt-get update && sudo apt-get install -y g++ g++-aarch64-linux-gnu
      - name: Obtain exact public SDK declaration
        run: |
          mkdir -p build/world-stability-sdk
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/ValveSoftware/openvr/0924064316de3effbcd1acf1e309182a2deb1c05/headers/openvr_capi.h -o build/world-stability-sdk/openvr_capi.h
      - name: Test actual portable core and cross-build standalone reference
        run: |
          bash tools/build_world_stability.sh build/world-stability-sdk build/world-stability
          python3 -B tests/test_world_stability_report.py build/world-stability/world-stability-test
      - name: Check portable lifecycle and budgets with sanitizers
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I . tests/world_stability_test.cpp -o build/world-stability/sanitized-test
          ASAN_OPTIONS=detect_leaks=1 build/world-stability/sanitized-test
      - name: Package reproducible inputs without Valve payloads
        run: |
          python3 -B tools/package_world_stability.py --binary build/world-stability/sfnp-world-stability-frame --output build/world-stability/world-stability-v2.zip
          python3 -B tools/package_world_stability.py --verify build/world-stability/world-stability-v2.zip
          python3 -B tools/package_world_stability.py --verify distribution/experiments/world-stability-v2.zip
