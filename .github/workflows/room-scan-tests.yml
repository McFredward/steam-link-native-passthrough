name: Experimental room setup
on:
  push:
    branches: [dev, arcturus-room-setup]
    paths:
      - 'room_scan/**'
      - 'room_reconstruction/**'
      - 'setup/steam_link_setup_room.py'
      - 'packaging/room-*.json'
      - 'probe/room_camera*'
      - 'probe/start_room_camera_api.py'
      - 'tests/*room*'
      - 'cmake/RoomScan.cmake'
      - 'setup/stream_bridge_install.py'
      - 'tools/*room*'
      - 'tools/package_stream_bridge.py'
      - '.github/workflows/room-scan-tests.yml'
  pull_request:
    paths:
      - 'room_scan/**'
      - 'room_reconstruction/**'
      - 'setup/steam_link_setup_room.py'
      - 'packaging/room-*.json'
      - 'probe/room_camera*'
      - 'probe/start_room_camera_api.py'
      - 'tests/*room*'
      - 'cmake/RoomScan.cmake'
      - 'setup/stream_bridge_install.py'
      - 'tools/*room*'
      - 'tools/package_stream_bridge.py'
      - '.github/workflows/room-scan-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface-gaussian-reference:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the separate CPU surface-optimization developer environment
        run: |
          python -m pip install numpy==2.5.4 scipy==1.18.1
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Check metric 2DGS, unseen-region stability, real gaps and withheld-image accuracy
        run: python -B -m unittest discover -s tests -p test_room_surface_gaussians.py -v
  pc-gaussian-mapping:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the exact PC numerical test dependencies
        run: python -m pip install numpy==2.5.4 scipy==1.18.1 pyfqmr==0.5.0 shapely==2.1.2 opencv-python-headless==5.0.0.93
      - name: Check metric rays, real gaps, revisit refinement and bounded transport
        run: python -B -m unittest discover -s tests -p test_room_pc_live.py -q
      - name: Check continuous detailed regions, incremental delivery and ceiling refinement
        run: python -B -m unittest discover -s tests -p test_room_live_streaming.py -q
      - name: Check the offline Gaussian trainer adapter separately
        run: python -B -m unittest discover -s tests -p test_room_reconstruction.py -q
      - name: Check independent metric measurements and held-out exposure validation
        run: python -B -m unittest discover -s tests -p test_room_measurement.py -q
      - name: Check joint optical and head calibration with unchanged baseline and withheld exposures
        run: python -B -m unittest discover -s tests -p test_room_stereo_rig_audit.py -q
      - name: Check measured room edges with rolling rows and withheld exposures
        run: python -B -m unittest discover -s tests -p test_room_line_measurement.py -q
      - name: Load the private Windows CUDA libraries and execute the actual model on CPU
        if: runner.os == 'Windows'
        run: python -B tools/check_room_pc_runtime.py --cache "${{ runner.temp }}/room-pc-runtime"
  dashboard-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the exact public OpenVR header
        run: |
          python3 - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          raw=urllib.request.urlopen('https://raw.githubusercontent.com/ValveSoftware/openvr/0924064316de3effbcd1acf1e309182a2deb1c05/headers/openvr_capi.h',timeout=30).read(1024*1024)
          assert hashlib.sha256(raw).hexdigest()=='3d32d8eb5bcbe2e250610123aee8142c68f0e7d4da823f87513b6a2a333078d7'
          path=Path('build/dashboard-sdk/openvr_capi.h');path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
          raw=urllib.request.urlopen('https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp',timeout=30).read(2*1024*1024)
          assert hashlib.sha256(raw).hexdigest()=='aaf127c04cb31c406e5b04a63f1ae89369fccde6d8fa7cdda1ed4f32dfc5de63'
          path=Path('build/native-room-json/nlohmann/json.hpp');path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
          PY
      - name: Exercise panel-only close, preserved dashboard and process-exit isolation
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I . -isystem build/dashboard-sdk tests/room_dashboard_test.cpp -pthread -o build/room-dashboard-test
          build/room-dashboard-test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I . -isystem build/dashboard-sdk tests/room_registration_test.cpp -o build/room-registration-test
          build/room-registration-test
      - name: Verify native source admission, exposure timing and pose-history bounds
        run: |
          for test in room_projection_test room_camera_source_test room_arcturus_geometry_test room_arcturus_timing_test; do
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I . -isystem build/dashboard-sdk -isystem build/native-room-json tests/$test.cpp -o build/$test -pthread
            build/$test
          done
  native-room-and-vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ordinary build tools and software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu glslc spirv-tools python3-pil fonts-dejavu-core mesa-vulkan-drivers
      - name: Prepare exact public graphics and API headers
        run: |
          python3 - <<'PYHEADERS'
          from pathlib import Path
          import hashlib,json,urllib.request
          inputs={
            'openvr/openvr_capi.h':('https://raw.githubusercontent.com/ValveSoftware/openvr/0924064316de3effbcd1acf1e309182a2deb1c05/headers/openvr_capi.h','3d32d8eb5bcbe2e250610123aee8142c68f0e7d4da823f87513b6a2a333078d7'),
            'json/nlohmann/json.hpp':('https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp','aaf127c04cb31c406e5b04a63f1ae89369fccde6d8fa7cdda1ed4f32dfc5de63')}
          for name,pin in json.loads(Path('packaging/room-vulkan-headers.json').read_text())['files'].items():
              inputs['vulkan/'+name]=('https://raw.githubusercontent.com/KhronosGroup/Vulkan-Headers/v1.3.275/include/'+name,pin['sha256'])
          for name,(url,digest) in inputs.items():
              raw=urllib.request.urlopen(url,timeout=30).read(2*1024*1024)
              assert hashlib.sha256(raw).hexdigest()==digest,name
              target=Path('build/room-deps')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
          PYHEADERS
          python3 -B tools/fetch_room_xr_headers.py build/room-deps/openxr
      - uses: actions/cache@v4
        with:
          path: |
            build/room-vision-sources
            build/room-vision-host
            build/room-vision-arm
          key: ${{ runner.os }}-room-vision-${{ hashFiles('packaging/room-vision.json', 'tools/build_room_vision.py') }}
      - name: Build pinned CPU vision modules without system installation
        run: |
          python3 -B tools/build_room_vision.py build/room-vision-sources build/room-vision-host --arch host --jobs 4
          python3 -B tools/build_room_vision.py build/room-vision-sources build/room-vision-arm --arch aarch64 --jobs 4
      - name: Exercise native dashboard, MR scene, real GPU and fusion paths
        run: |
          bash tools/build_room_overlay.sh build/room-deps/openvr build/room-deps/json /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf build/room-native build/room-deps/vulkan build/room-deps/openxr build/room-vision-host/libsfnp-room-vision.so build/room-vision-arm/libsfnp-room-vision.so
      - name: Exercise real kernel guards, local API packets and diagnostic decoding
        run: bash tools/build_room_camera_api.sh build/room-deps/json build/manual-camera-api
  core-and-installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated portable room checks
        run: |
          cmake -S . -B build/room-core -DFRAME_ROOM_SCAN_ONLY=ON
          cmake --build build/room-core
          ctest --test-dir build/room-core --output-on-failure
      - name: Verify installer transactions and optional dashboard package
        run: |
          python3 -B -m unittest discover -s tests -p test_room_capture_session.py -q
          python3 -B -m unittest discover -s tests -p test_stream_bridge_install.py -q
          python3 -B -m unittest discover -s tests -p test_package_stream_bridge.py -q
          python3 -B -m unittest discover -s tests -p test_pc_only_setup.py -q
