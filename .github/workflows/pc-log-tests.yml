name: Private PC log collection
on:
  push:
    branches: [dev]
    paths:
      - 'distribution/collect-pc-logs*.ps1'
      - '.github/workflows/pc-log-tests.yml'
  pull_request:
    paths:
      - 'distribution/collect-pc-logs*.ps1'
      - '.github/workflows/pc-log-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Exercise bounded collection and failure recovery in Windows PowerShell 5.1
        shell: powershell
        run: ./distribution/collect-pc-logs.tests.ps1
      - name: Exercise the same fixtures in PowerShell 7
        shell: pwsh
        run: ./distribution/collect-pc-logs.tests.ps1
