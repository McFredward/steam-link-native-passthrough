name: MR handoff profiling report
on:
  push:
    branches: [dev]
    paths:
      - 'tools/analyze_mr_handoff.py'
      - 'tests/test_mr_handoff_report.py'
      - '.github/workflows/mr-handoff-profile-tests.yml'
  pull_request:
    paths:
      - 'tools/analyze_mr_handoff.py'
      - 'tests/test_mr_handoff_report.py'
      - '.github/workflows/mr-handoff-profile-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check independent counter windows and unknown-data handling
        run: python3 -B tests/test_mr_handoff_report.py
