name: Native shared-source alpha diagnostics
on:
  push:
    branches: [dev]
    paths:
      - 'pc/stream-bridge-source-alpha*'
      - 'pc/stream-bridge-projected-alpha-replay.h'
      - 'pc/stream-bridge-projected-alpha-scene-capture.h'
      - 'pc/stream-bridge-projected-alpha-sync.h'
      - 'pc/stream-bridge-projected-alpha-channel.h'
      - 'pc/stream-bridge-projected-alpha-kernels.h'
      - 'pc/stream-bridge-projected-alpha-textures.h'
      - 'pc/stream-bridge-projected-alpha-geometry.h'
      - 'pc/stream-bridge-projected-alpha-producer.h'
      - 'pc/stream-bridge-projected-alpha-consumer.h'
      - 'pc/stream-bridge-projected-alpha-launch.h'
      - 'pc/stream-bridge-source-audit*'
      - 'pc/stream-bridge-sender-provider-shaders*'
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'pc/stream-bridge-sender-provider.cpp'
      - 'tests/test_stream_bridge_source_alpha*'
      - 'tests/test_stream_bridge_projected_alpha_gpu.cpp'
      - 'tests/check_projected_alpha_hlsl.py'
      - 'tests/build_projected_windows_fixtures.py'
      - 'tests/test_stream_bridge_projected_channel_windows.cpp'
      - 'tests/test_stream_bridge_projected_producer_windows.cpp'
      - 'tools/generate_projected_alpha_kernels.py'
      - '.github/workflows/source-alpha-tests.yml'
  pull_request:
    paths:
      - 'pc/stream-bridge-source-alpha*'
      - 'pc/stream-bridge-projected-alpha-replay.h'
      - 'pc/stream-bridge-projected-alpha-scene-capture.h'
      - 'pc/stream-bridge-projected-alpha-sync.h'
      - 'pc/stream-bridge-projected-alpha-channel.h'
      - 'pc/stream-bridge-projected-alpha-kernels.h'
      - 'pc/stream-bridge-projected-alpha-textures.h'
      - 'pc/stream-bridge-projected-alpha-geometry.h'
      - 'pc/stream-bridge-projected-alpha-producer.h'
      - 'pc/stream-bridge-projected-alpha-consumer.h'
      - 'pc/stream-bridge-projected-alpha-launch.h'
      - 'pc/stream-bridge-source-audit*'
      - 'pc/stream-bridge-sender-provider-shaders*'
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'pc/stream-bridge-sender-provider.cpp'
      - 'tests/test_stream_bridge_source_alpha*'
      - 'tests/test_stream_bridge_projected_alpha_gpu.cpp'
      - 'tests/check_projected_alpha_hlsl.py'
      - 'tests/build_projected_windows_fixtures.py'
      - 'tests/test_stream_bridge_projected_channel_windows.cpp'
      - 'tests/test_stream_bridge_projected_producer_windows.cpp'
      - 'tools/generate_projected_alpha_kernels.py'
      - '.github/workflows/source-alpha-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-alpha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owned-hlsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Microsoft compiler for owned HLSL only
        run: |
          mkdir -p build/dxc
          curl --fail --location --retry 3 --max-time 60 https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2505.1/linux_dxc_2025_07_14.x86_64.tar.gz -o build/dxc.tar.gz
          echo 'f2213da1fc99dc8778c8823078e16ba97c7f80f86a1d4520ab1adf4b462bc48c  build/dxc.tar.gz' | sha256sum --check --strict
          tar -xzf build/dxc.tar.gz -C build/dxc
      - name: Reject owned shader syntax errors before D3D11 execution
        run: python3 tests/check_projected_alpha_hlsl.py build/dxc/bin/dxc
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check coherent bounded diagnostic publication
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I. tests/test_stream_bridge_source_alpha_publication.cpp -o /tmp/source-alpha-publication
          /tmp/source-alpha-publication
  gpu:
    needs: owned-hlsl
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build actual D3D11 source-alpha fixture
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SFNP_VS=%%i"
          if not defined SFNP_VS exit /b 1
          call "%SFNP_VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX /I. tests/test_stream_bridge_source_alpha_gpu.cpp /Fe:build\source-alpha.exe /Fo:build\ /link d3d11.lib dxgi.lib dxguid.lib uuid.lib
          if errorlevel 1 exit /b 1
          python tests/build_projected_windows_fixtures.py --compiler msvc --output build
          if errorlevel 1 exit /b 1
      - name: Verify actual RGBA and BGRA readbacks without source mutation
        shell: cmd
        run: |
          build\source-alpha.exe >build\source-alpha.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\source-alpha.log
          exit /b %SFNP_RESULT%
      - name: Verify isolated native-state alpha replay primitive on actual WARP
        shell: cmd
        run: |
          build\projected-alpha.exe --export-owned-kernels build >build\projected-alpha.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\projected-alpha.log
          exit /b %SFNP_RESULT%
      - name: Execute embedded owned kernels without runtime HLSL compilation in the primitive
        shell: cmd
        run: |
          build\projected-alpha.exe >build\projected-alpha-embedded.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\projected-alpha-embedded.log
          exit /b %SFNP_RESULT%
      - name: Verify private cross-process handle transfer and peer lifetime
        shell: cmd
        run: |
          build\projected-channel.exe >build\projected-channel.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\projected-channel.log
          exit /b %SFNP_RESULT%
      - name: Verify production alpha ancestry and original ownership boundaries
        shell: cmd
        run: |
          build\projected-producer.exe >build\projected-producer.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\projected-producer.log
          exit /b %SFNP_RESULT%
      - name: Verify the actual producer and consumer in separate Windows processes
        shell: cmd
        run: |
          build\projected-producer.exe --consumer >build\projected-producer-consumer.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\projected-producer-consumer.log
          exit /b %SFNP_RESULT%
      - name: Verify production FP16 filtering with typed and typeless native storage
        shell: cmd
        run: |
          build\projected-producer.exe --float >build\projected-producer-float.log 2>&1
          if errorlevel 1 (type build\projected-producer-float.log & exit /b 1)
          type build\projected-producer-float.log
          build\projected-producer.exe --typeless >build\projected-producer-typeless.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\projected-producer-typeless.log
          exit /b %SFNP_RESULT%
      - name: Verify complete production alpha under actual ordinary-target GPU memory pressure
        shell: cmd
        run: |
          build\projected-producer.exe --pressure >build\projected-producer-pressure.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\projected-producer-pressure.log
          exit /b %SFNP_RESULT%
      - name: Verify padded viewport ancestry and native depth-stencil comparisons on the GPU
        shell: cmd
        run: |
          build\projected-producer.exe --padded >build\projected-producer-padded.log 2>&1
          if errorlevel 1 (type build\projected-producer-padded.log & exit /b 1)
          type build\projected-producer-padded.log
          build\projected-producer.exe --padded-depth >build\projected-producer-padded-depth.log 2>&1
          if errorlevel 1 (type build\projected-producer-padded-depth.log & exit /b 1)
          type build\projected-producer-padded-depth.log
          build\projected-producer.exe --reproject-depth >build\projected-producer-reproject-depth.log 2>&1
          if errorlevel 1 (type build\projected-producer-reproject-depth.log & exit /b 1)
          type build\projected-producer-reproject-depth.log
          build\projected-producer.exe --dxgi-sync >build\projected-producer-dxgi-sync.log 2>&1
          if errorlevel 1 (type build\projected-producer-dxgi-sync.log & exit /b 1)
          type build\projected-producer-dxgi-sync.log
          build\projected-producer.exe --native-single >build\projected-producer-native-single.log 2>&1
          if errorlevel 1 (type build\projected-producer-native-single.log & exit /b 1)
          type build\projected-producer-native-single.log
          build\projected-producer.exe --native-mrt >build\projected-producer-native-mrt.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\projected-producer-native-mrt.log
          exit /b %SFNP_RESULT%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-alpha-evidence
          path: |
            build/source-alpha.log
            build/projected-alpha.log
            build/projected-alpha-embedded.log
            build/projected-channel.log
            build/projected-producer.log
            build/projected-producer-consumer.log
            build/projected-producer-float.log
            build/projected-producer-typeless.log
            build/projected-producer-pressure.log
            build/projected-producer-padded.log
            build/projected-producer-padded-depth.log
            build/projected-producer-reproject-depth.log
            build/projected-producer-dxgi-sync.log
            build/projected-producer-native-single.log
            build/projected-producer-native-mrt.log
            build/projected-alpha-clone64.dxbc
            build/projected-alpha-clone80.dxbc
            build/projected-alpha-clone32.dxbc
